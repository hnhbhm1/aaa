<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>الإعدادات</h1>
            <nav>
                <a href="index.html">الرئيسية</a>
                <a href="settings.html">الإعدادات</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="settings-card">
            <h2>تعديل سعر الدولار</h2>
            <div class="form-group">
                <label for="dollarRate">سعر الدولار (مثلاً 545):</label>
                <input type="number" id="dollarRate" step="0.01" min="0" value="545">
                <button id="saveRate">حفظ</button>
                <p id="rateStatus" class="status-msg"></p>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>جميع الحقوق محفوظة &copy; 2025</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
